name: Daily Jollein XML

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: Europe/Athens
  workflow_dispatch:
    inputs:
      refresh_source:
        description: Fetch all current supplier data before publishing
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'public/**'
      - '.github/workflows/daily-feed.yml'

concurrency:
  group: jollein-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify pricing and availability rules
        run: python -m unittest discover -s tests -v
      - name: Install optional JavaScript fallback
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fresh complete supplier crawl
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source)
        run: python daily_refresh.py --output public
      - name: Keep daily schedule active and retain latest validated feed
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m 'Update validated Jollein customer feed' || test -z "$(git status --porcelain public)"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish stable XML link
        id: deployment
        uses: actions/deploy-pages@v4
